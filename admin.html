<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Royal Daawat · Operations</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c0e0b;--panel:#2a1612;--line:#5a3a2c;--cu:#c9854f;--sf:#f0b44c;--tx:#f5ead8;--mut:#b9a58f;--ok:#8fcf9b;--err:#ff8a7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Hanken Grotesk',sans-serif}
h1,h2,h3{font-family:Fraunces,serif;margin:0}
.wrap{max-width:1100px;margin:auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
nav button,.btn{background:var(--panel);color:var(--tx);border:1px solid var(--line);padding:9px 16px;border-radius:4px;font:inherit;cursor:pointer}
nav button.on,.btn.p{background:var(--sf);color:#2a1200;border-color:var(--sf);font-weight:700}
.btn.d{color:var(--err)}:focus-visible{outline:2px solid var(--sf);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat{border:1px solid var(--line);background:var(--panel);padding:14px;border-radius:4px}
.stat b{display:block;font:800 1.7rem Fraunces,serif;color:var(--sf)}.stat span{color:var(--mut)}
.o{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:10px}
.o.New{border-left:4px solid var(--sf)}.o small,.mut{color:var(--mut)}
@media(max-width:700px){.o{grid-template-columns:1fr}}
select,input,textarea{background:#170b08;color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:9px;font:inherit;width:100%}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;border:1px solid var(--cu);padding:16px;border-radius:4px;background:var(--panel);margin:16px 0}
form .full{grid-column:1/-1}
.m{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0;flex-wrap:wrap}
.m .info{display:flex;gap:12px;align-items:center;min-width:0;flex:1 1 280px}
.th{flex:none;width:60px;height:60px;border-radius:6px;border:1px solid var(--line);background:#170b08 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:.7rem;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.pv{display:flex;gap:10px;align-items:center}.pv .th{width:48px;height:48px}.pv input{flex:1}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--cu);color:var(--sf);border-radius:99px;padding:0 8px;margin-left:6px;vertical-align:middle}
.chk{display:flex;align-items:center;gap:10px;color:var(--tx);cursor:pointer}.chk input{width:20px;height:20px;accent-color:#f0b44c;flex:none}
.hint{font-size:.8rem;color:var(--mut);margin-top:3px}
.gate{max-width:340px;margin:18vh auto;text-align:center}.gate input{margin:14px 0}
.hide{display:none!important}.err{color:var(--err)}
</style></head><body>
<div class="wrap" id="app">
<header><h1>Royal Daawat operations</h1>
<nav><button id="t1" class="on">Orders</button> <button id="t2">Menu</button> <button id="t3">Categories</button></nav></header>

<div id="v1"><div class="stats">
<div class="stat"><b id="sN">0</b><span>New requests</span></div>
<div class="stat"><b id="sC">0</b><span>Confirmed</span></div>
<div class="stat"><b id="sD">0</b><span>Cooking now</span></div>
<div class="stat"><b id="sR">₹0</b><span>Confirmed and delivered value</span></div></div>
<select id="flt" aria-label="Filter orders" style="max-width:220px;margin-bottom:14px"><option value="">All statuses</option></select>
<div id="orders"><p class="mut">Loading orders…</p></div></div>

<div id="v2" class="hide"><form id="mf"><h3 class="full" id="mt">Add dish</h3>
<input type="hidden" id="mid">
<div><label class="mut" for="mn">Name</label><input id="mn" required></div>
<div><label class="mut" for="mc">Category (isi me dish add hogi)</label><select id="mc" required></select><input id="mcn" class="hide" placeholder="Naye category ka naam" style="margin-top:6px"></div>
<div><label class="mut" for="mp">Price (₹)</label><input id="mp" type="number" min="0" step="any" required></div>
<div><label class="mut" for="mu">Unit (kg, pcs, plate…)</label><input id="mu" placeholder="kg"></div>
<div><label class="mut" for="ms">Kitne log khayenge per kg/unit?</label><input id="ms" type="number" min="0.1" step="any" value="5" required><div class="hint">e.g. 1 kg = 5 persons</div></div>
<div class="full"><label class="mut" for="mi">Dish Photo URL</label><div class="pv"><div class="th" id="mpv">No photo</div><input id="mi" type="url" inputmode="url" placeholder="https://…/dish.jpg"></div></div>
<div class="full"><label class="chk"><input type="checkbox" id="mb" checked><span>Show in Sliding Banner <span class="mut">(photo wali dishes hi banner me dikhti hain)</span></span></label></div>
<div class="full"><label class="mut" for="md">Description</label><textarea id="md" rows="2"></textarea></div>
<div class="full"><button class="btn p" type="submit">Save dish</button> <button class="btn" type="button" id="mx">Clear</button></div></form>
<div id="mlist"><p class="mut">Loading menu…</p></div>
<button class="btn hide" id="seed">Add starter menu</button></div>

<div id="v3" class="hide"><form id="cf"><h3 class="full" id="ct">Add category photo</h3>
<input type="hidden" id="cid"><input type="hidden" id="cold">
<div><label class="mut" for="cn">Category name</label><input id="cn" required placeholder="Biryani"></div>
<div><label class="mut" for="ci">Category Photo / Icon URL</label><div class="pv"><div class="th" id="cpv">No photo</div><input id="ci" type="url" inputmode="url" placeholder="https://…/icon.jpg"></div></div>
<div class="full"><button class="btn p" type="submit">Save category</button> <button class="btn" type="button" id="cx">Clear</button></div></form>
<div id="clist"><p class="mut">Loading categories…</p></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAZKvp9yhCq9l-7-wXiy-qkx3llHw_-618",
  authDomain: "biryani-category.firebaseapp.com",
  databaseURL: "https://biryani-category-default-rtdb.firebaseio.com",
  projectId: "biryani-category",
  storageBucket: "biryani-category.firebasestorage.app",
  messagingSenderId: "86398170612",
  appId: "1:86398170612:web:2029aeed3ca7cad88af5a1",
  measurementId: "G-XJ6RXX1GX3"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database(),$=id=>document.getElementById(id);
const STATUS=['New','Confirmed','Cooking','Out for delivery','Delivered','Cancelled'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const okUrl=u=>/^https?:\/\/\S+$/i.test(u||'');
const thumb=u=>okUrl(u)?`<div class="th"><img src="${esc(u)}" alt="" loading="lazy" onerror="this.parentNode.textContent='Bad URL'"></div>`:'<div class="th">No photo</div>';
const serves=m=>{const s=Number(m.servesPerUnit);if(s>0)return s;const p=Number(m.perGuest);return p>0?Math.round(100/p)/100:1};
let orders={},menu={},cats={};
$('flt').innerHTML+=STATUS.map(s=>`<option>${s}</option>`).join('');

const tab=n=>[1,2,3].forEach(i=>{$('v'+i).classList.toggle('hide',i!==n);$('t'+i).classList.toggle('on',i===n)});
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);$('t3').onclick=()=>tab(3);

listen();
function listen(){
  db.ref('orders').on('value',s=>{orders=s.val()||{};renderOrders()},()=>$('orders').innerHTML='<p class="err">Could not load orders. Check database rules and connection.</p>');
  db.ref('menu').on('value',s=>{menu=s.val()||{};renderMenu();renderCats()});
  db.ref('categories').on('value',s=>{cats=s.val()||{};renderCats();renderMenu()},()=>$('clist').innerHTML='<p class="err">Could not load categories. Check database rules for the "categories" node.</p>');
}
$('flt').onchange=()=>renderOrders();

/* ---------- orders ---------- */
function renderOrders(){
  const list=Object.entries(orders).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));
  const c=s=>list.filter(([,o])=>o.status===s);
  $('sN').textContent=c('New').length;$('sC').textContent=c('Confirmed').length;
  $('sD').textContent=c('Cooking').length;
  $('sR').textContent=inr(list.filter(([,o])=>['Confirmed','Cooking','Out for delivery','Delivered'].includes(o.status)).reduce((a,[,o])=>a+(o.total||0),0));
  const f=$('flt').value,shown=list.filter(([,o])=>!f||o.status===f);
  $('orders').innerHTML=shown.length?shown.map(([id,o])=>`<div class="o ${esc(o.status)}"><div>
    <h3>${esc(o.name)}</h3>
    <div>${esc(o.date)} at ${esc(o.time)} · ~${esc(o.guests)} guests</div>
    <small>${esc(o.venue)} · <a style="color:var(--sf)" href="tel:${esc(o.phone)}">${esc(o.phone)}</a></small>
    <div>${(o.items||[]).map(i=>esc(i.name)+(i.qty?' × '+esc(i.qty)+(i.unit?' '+esc(i.unit):''):'')+(i.serves?' ('+esc(i.serves)+' log)':'')).join(', ')}</div>
    ${o.notes?`<small>Notes: ${esc(o.notes)}</small>`:''}<div><b>${inr(o.total)}</b></div></div>
    <div><select data-id="${esc(id)}" aria-label="Order status">${STATUS.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select>
    <button class="btn d" data-del="${esc(id)}" style="margin-top:8px;width:100%">Delete</button></div></div>`).join(''):'<p class="mut">No orders match this view.</p>';
}
$('orders').addEventListener('change',e=>{const id=e.target.dataset.id;id&&db.ref('orders/'+id+'/status').set(e.target.value)});
$('orders').addEventListener('click',e=>{const id=e.target.dataset.del;if(id&&confirm('Delete this order permanently?'))db.ref('orders/'+id).remove()});

/* ---------- menu ---------- */
function renderMenu(){
  const l=Object.entries(menu);
  $('seed').classList.toggle('hide',l.length>0);
  $('mlist').innerHTML=l.length?l.map(([id,m])=>`<div class="m"><div class="info">${thumb(m.image)}<div style="min-width:0"><b>${esc(m.name)}</b>${m.image&&m.showInBanner!==false&&m.available!==false?'<span class="tag">In banner</span>':''}${m.available===false?'<span class="tag" style="color:var(--err);border-color:var(--err)">Sold out</span>':''}
  <br><small class="mut">${esc(m.category||'Biryani')} · ${inr(m.price)}${m.unit?' per '+esc(m.unit):''} · 1 ${esc(m.unit||'unit')} = ${esc(serves(m))} persons</small><br><small class="mut">${esc(m.desc)}</small></div></div>
  <div><button class="btn" data-av="${esc(id)}">${m.available===false?'Mark available':'Mark sold out'}</button>
  <button class="btn" data-ed="${esc(id)}">Edit</button> <button class="btn d" data-rm="${esc(id)}">Delete</button></div></div>`).join(''):'<p class="mut">No dishes yet. Add one above or load the starter menu.</p>';
  fillCatSelect();
}
$('mlist').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=b.dataset;
  if(t.av)db.ref('menu/'+t.av+'/available').set(menu[t.av].available===false);
  if(t.rm&&confirm('Delete this dish?'))db.ref('menu/'+t.rm).remove();
  if(t.ed){const m=menu[t.ed];$('mid').value=t.ed;$('mn').value=m.name||'';setCat(m.category||'Biryani');$('mp').value=m.price;$('mu').value=m.unit||'';
    $('ms').value=serves(m);$('mi').value=m.image||'';$('mb').checked=m.showInBanner!==false;$('md').value=m.desc||'';
    prev('mi','mpv');touched=true;$('mt').textContent='Edit dish';scrollTo(0,0)}});

function fillCatSelect(keep){
  const cur=keep!==undefined?keep:$('mc').value,names=catRows().map(c=>c.name);
  if(cur&&cur!=='__new'&&!names.includes(cur))names.push(cur);
  $('mc').innerHTML=names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')+'<option value="__new">+ Naya category…</option>';
  $('mc').value=cur&&(names.includes(cur)||cur==='__new')?cur:(names[0]||'__new');
  catNew()}
function catNew(){const n=$('mc').value==='__new';$('mcn').classList.toggle('hide',!n);$('mcn').required=n}
function setCat(n){fillCatSelect(n);$('mcn').value=''}
const getCat=()=>$('mc').value==='__new'?$('mcn').value.trim():$('mc').value;
$('mc').onchange=()=>{catNew();if($('mc').value==='__new')$('mcn').focus()};
function prev(inp,box){const u=$(inp).value.trim();$(box).innerHTML=okUrl(u)?`<img src="${esc(u)}" alt="" onerror="this.parentNode.textContent='Bad URL'">`:'No photo'}
let touched=false;
$('mb').onchange=()=>touched=true;
$('mi').oninput=()=>{prev('mi','mpv');if(!touched)$('mb').checked=okUrl($('mi').value.trim())};
$('ci').oninput=()=>prev('ci','cpv');

const clear=()=>{const keep=getCat();$('mf').reset();$('mid').value='';setCat(keep||undefined);$('mt').textContent='Add dish';touched=false;prev('mi','mpv')};$('mx').onclick=clear;
$('mf').onsubmit=e=>{e.preventDefault();
  const img=$('mi').value.trim(),sv=Number($('ms').value),catName=getCat();
  if(!catName){alert('Category chunein ya naya naam likhein.');return}
  if(img&&!okUrl(img)){alert('Photo URL http:// ya https:// se shuru hona chahiye.');return}
  if(!(sv>0)){alert('"Kitne log khayenge per unit" 0 se zyada hona chahiye.');return}
  const d={name:$('mn').value.trim(),category:catName,price:Number($('mp').value),unit:$('mu').value.trim(),
    servesPerUnit:sv,image:img||null,showInBanner:$('mb').checked,desc:$('md').value.trim()},id=$('mid').value;
  (id?db.ref('menu/'+id).update(d):db.ref('menu').push({...d,available:true})).then(clear).catch(()=>alert('Save failed. Check database rules.'))};

$('seed').onclick=()=>[
  {name:'Dum Gosht Pateli Biryani',category:'Biryani',price:950,servesPerUnit:5,desc:'Aged basmati and tender mutton, sealed with dough and slow-cooked.'},
  {name:'Murgh Zafrani Biryani',category:'Biryani',price:780,servesPerUnit:5,desc:'Saffron-marinated chicken layered with fried onions and mint.'},
  {name:'Subz Awadhi Biryani',category:'Biryani',price:650,servesPerUnit:5,desc:'Seasonal vegetables, kewra and whole spices.'},
  {name:'Mirchi ka Salan and Burhani Raita',category:'Sides',price:120,servesPerUnit:6,desc:'Served alongside the biryani.'}
].forEach(d=>db.ref('menu').push({unit:'kg',showInBanner:true,available:true,...d}));

/* ---------- categories ---------- */
function catRows(){
  const m=new Map();
  Object.entries(cats).forEach(([id,c])=>{if(c&&c.name)m.set(c.name.toLowerCase(),{id,name:c.name,image:c.image||'',n:0})});
  Object.values(menu).forEach(d=>{const n=d.category||'Biryani',k=n.toLowerCase();
    if(!m.has(k))m.set(k,{id:'',name:n,image:'',n:0});m.get(k).n++});
  return [...m.values()];
}
function renderCats(){
  fillCatSelect();
  const l=catRows();
  $('clist').innerHTML=l.length?l.map(c=>`<div class="m"><div class="info">${thumb(c.image)}<div><b>${esc(c.name)}</b><br><small class="mut">${c.n} dish${c.n===1?'':'es'}${c.image?'':' · photo not set'}</small></div></div>
  <div><button class="btn p" data-cadd="${esc(c.name)}">+ Add dish</button> <button class="btn" data-ce="${esc(c.name)}">${c.image?'Edit':'Add photo'}</button>${c.id?` <button class="btn d" data-cd="${esc(c.id)}">Delete</button>`:''}</div></div>`).join(''):'<p class="mut">No categories yet. Add a dish or create a category above.</p>';
}
$('clist').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=b.dataset;
  if(t.ce!==undefined){const c=catRows().find(x=>x.name===t.ce);if(!c)return;
    $('cid').value=c.id;$('cold').value=c.name;$('cn').value=c.name;$('ci').value=c.image;prev('ci','cpv');$('ct').textContent='Edit category';scrollTo(0,0)}
  if(t.cadd!==undefined){clear();setCat(t.cadd);tab(2);scrollTo(0,0);$('mn').focus()}
  if(t.cd&&confirm('Delete this category photo/record? Dishes will stay as they are.'))db.ref('categories/'+t.cd).remove()});
const cclear=()=>{$('cf').reset();$('cid').value='';$('cold').value='';$('ct').textContent='Add category photo';prev('ci','cpv')};$('cx').onclick=cclear;
$('cf').onsubmit=e=>{e.preventDefault();
  const name=$('cn').value.trim(),image=$('ci').value.trim(),old=$('cold').value,id=$('cid').value;
  if(!name)return;
  if(image&&!okUrl(image)){alert('Photo URL http:// ya https:// se shuru hona chahiye.');return}
  if(catRows().some(c=>c.name.toLowerCase()===name.toLowerCase()&&c.name.toLowerCase()!==old.toLowerCase())){alert('Is naam ki category pehle se hai.');return}
  const key=id||db.ref('categories').push().key,u={};
  u['categories/'+key]={name,image:image||null};
  if(old&&old!==name)Object.entries(menu).forEach(([did,d])=>{if((d.category||'Biryani')===old)u['menu/'+did+'/category']=name});
  db.ref().update(u).then(cclear).catch(()=>alert('Save failed. Check database rules.'))};
</script></body></html>
